name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-latest]
        bazel: ["8.x", "9.x"]
    runs-on: ${{ matrix.os }}
    name: bazel ${{ matrix.bazel }} on ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      - run: bazel test --test_output=errors //...

      # `//mutants:config` reaching the enumeration step is only observable as a
      # change in outcome, so assert the change. `under_tested_mutants` fails by
      # design; excluding its one file leaves nothing to mutate, and it passes.
      # Before the flag existed a config was silently ignored, which looked
      # exactly like a config that excluded nothing.
      - name: config flag is honoured
        run: |
          bazel test --test_output=errors //example:under_tested_mutants \
            --@//mutants:config=//example:mutants_config.toml

      # The report output group, scoped by changed_lines_spec. In
      # example/under_tested.rs only `triple` (lines 5-8) is untested, so a
      # change to `double` (lines 1-3) must report its mutants caught and leave
      # `triple`'s untested, and a change to `triple` must report them missed --
      # with the build itself passing either way.
      - name: report output group honours changed lines
        run: |
          # Bazel relays the action's own output to stdout, so keep it out of
          # the captured report.
          report() {
            bazel build //example:under_tested_test \
              --aspects=//mutants:cargo_mutants_test.bzl%cargo_mutants_aspect \
              --output_groups=cargo_mutants_report \
              --@//mutants:changed_lines_spec="{\"files\": {\"example/under_tested.rs\": [[$1, $2]]}}" >&2
            cat bazel-bin/example/under_tested_test.mutants.report.json
          }
          double="$(report 1 3)"
          echo "$double" | jq -e '[.mutants[].outcome] | length > 0 and all(. == "caught" or . == "timeout")'
          echo "$double" | jq -e '[.mutants[] | select(.line >= 5)] | length == 0'
          triple="$(report 6 7)"
          echo "$triple" | jq -e '[.mutants[] | select(.outcome == "missed")] | length > 0'
          echo "$triple" | jq -e '[.mutants[] | select(.line < 5)] | length == 0'

  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-lint
          repository-cache: true
      - run: bazel run //:buildifier.check
