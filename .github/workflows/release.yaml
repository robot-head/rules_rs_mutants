# Cut a release whenever a new tag is pushed to the repo.
name: Release

on:
  # Developers push a tag from their clone: git tag v0.0.1 && git push origin v0.0.1
  push:
    tags:
      - "v*.*.*"
  # Or retry a failed release from the Actions tab.
  workflow_dispatch:
    inputs:
      tag_name:
        description: git tag to release
        required: true
        type: string

permissions:
  id-token: write
  attestations: write
  contents: write

jobs:
  release:
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@v7.7.0
    with:
      release_files: rules_rs_mutants-*.tar.gz
      prerelease: false
      # The repo has immutable releases on, and publishing attaches the
      # registry entry's attestations to the release, so it stays a draft
      # until `publish` is done and `finalize` below publishes it.
      draft: true
      tag_name: ${{ inputs.tag_name || github.ref_name }}

  publish:
    needs: release
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ inputs.tag_name || github.ref_name }}
    secrets:
      publish_token: ${{ secrets.BCR_PUBLISH_TOKEN }}

  finalize:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - run: gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag_name || github.ref_name }}
